// ---------- 2. ゲームの設定（数字を変えると難しさが変わる） ----------
const W = 480, H = 640;              // 画面の大きさ（内部の座標系）
const COLS = 10, ROWS = 13;          // ブロックの列数・行数
const BW = W / COLS, BH = 36;        // ブロック1個の幅・高さ
const FIELD_H = ROWS * BH;           // ブロックが並ぶ範囲の高さ（これより下は操作エリア）
const BALL_R = 7;                    // ボールの半径
const PADDLE_W = 84, PADDLE_H = 12;  // パドルの大きさ
const PADDLE_Y = H - 36;             // パドルの縦位置
const SPEED_START = 4.6;             // ボールの最初のスピード
const SPEED_MAX = 8.2;               // ボールの最高スピード
const LIVES_START = 3;               // 最初のライフ

// ---------- 3. キャンバスの準備（2倍の解像度でくっきり表示） ----------
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
canvas.width = W * 2;
canvas.height = H * 2;
ctx.setTransform(2, 0, 0, 2, 0, 0);   // 以降は 480x640 の座標で描ける
ctx.imageSmoothingQuality = "high";

// ---------- 4. ゲームの状態を入れる変数 ----------
let state = "loading";   // loading / title / ready(発射待ち) / play / clear / over
let blocks = [];         // 全ブロック
let grid = [];           // 行列で引けるブロック表（当たり判定を速くするため）
let remaining = 0;       // 残りブロック数
let totalBlocks = 0;
let score = 0, lives = LIVES_START;
let speed = SPEED_START;
let px = W / 2;          // パドルの中心X
let ball = { x: W / 2, y: PADDLE_Y - BALL_R, vx: 0, vy: 0 };
let particles = [];      // 壊れたときのキラキラ
let dim = 1;             // 下エリアの暗幕の濃さ（クリアすると0になって絵が全部見える）
const keys = { left: false, right: false };

const painting = new Image();     // 本物の絵
let veil = null;                  // ベール用のぼかした絵
let tinyCtx = null;               // ブロックの色を調べる用の小さな絵

// ---------- 5. 画像の読み込み後にベールを作る ----------
painting.onload = () => {
  // ごく小さく縮小した絵を作る → 拡大するとぼんやりした「ベール」になる
  const tiny = document.createElement("canvas");
  tiny.width = COLS * 3; tiny.height = ROWS * 3;
  tinyCtx = tiny.getContext("2d", { willReadFrequently: true });
  // ブロックが覆う範囲（絵の上から FIELD_H/H の割合）だけを切り出して縮小
  tinyCtx.drawImage(painting, 0, 0, painting.width, painting.height * FIELD_H / H, 0, 0, tiny.width, tiny.height);

  veil = document.createElement("canvas");
  veil.width = W; veil.height = FIELD_H;
  const vctx = veil.getContext("2d");
  vctx.imageSmoothingEnabled = true;
  vctx.imageSmoothingQuality = "high";
  vctx.drawImage(tiny, 0, 0, W, FIELD_H);   // 小→大に引き伸ばしてぼかす

  resetGame();
  state = "title";
};
painting.src = IMG_SRC;

// ---------- 6. ブロックを作る ----------
function makeBlocks() {
  blocks = []; grid = [];
  for (let r = 0; r < ROWS; r++) {
    grid[r] = [];
    for (let c = 0; c < COLS; c++) {
      // 5個に1個くらいを「2回あてないと壊れない」硬いブロックにする
      const hp = ((r * 3 + c * 7) % 5 === 0) ? 2 : 1;
      // 絵のその場所の色を取り出す（壊れたときのかけらの色に使う）
      let color = "255,255,255";
      try {
        const d = tinyCtx.getImageData(c * 3 + 1, r * 3 + 1, 1, 1).data;
        color = d[0] + "," + d[1] + "," + d[2];
      } catch (e) { /* 取れなければ白のまま */ }
      const b = { x: c * BW, y: r * BH, hp, maxhp: hp, alive: true, color };
      blocks.push(b);
      grid[r][c] = b;
    }
  }
  totalBlocks = remaining = blocks.length;
}

// ---------- 7. ゲームを最初からやり直す ----------
function resetGame() {
  makeBlocks();
  score = 0; lives = LIVES_START;
  speed = SPEED_START;
  particles = [];
  dim = 1;
  serve();
}

// ボールをパドルの上に乗せる（発射待ち）
function serve() {
  ball.x = px; ball.y = PADDLE_Y - BALL_R;
  ball.vx = 0; ball.vy = 0;
}

// ---------- 8. 入力（キーボード・マウス・タッチ） ----------
window.addEventListener("keydown", (e) => {
  if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keys.left = true;
  if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") keys.right = true;
  if (e.key === " " || e.key === "Enter") act();
  if (["ArrowLeft", "ArrowRight", " "].includes(e.key)) e.preventDefault(); // 画面スクロール防止
});
window.addEventListener("keyup", (e) => {
  if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keys.left = false;
  if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") keys.right = false;
});

// マウス/指の位置をゲーム座標に直してパドルを動かす
function pointerX(e) {
  const rect = canvas.getBoundingClientRect();
  return (e.clientX - rect.left) / rect.width * W;
}
canvas.addEventListener("pointermove", (e) => { px = pointerX(e); clampPaddle(); });
canvas.addEventListener("pointerdown", (e) => { px = pointerX(e); clampPaddle(); act(); });

function clampPaddle() {
  px = Math.max(PADDLE_W / 2, Math.min(W - PADDLE_W / 2, px));
}

// クリック／タップ／スペースで「次の段階へ」進める
function act() {
  initAudio();
  if (state === "title") {
    state = "ready";
  } else if (state === "ready") {
    // 少しだけランダムな角度で真上に発射
    const ang = (Math.random() - 0.5) * 0.7;
    ball.vx = speed * Math.sin(ang);
    ball.vy = -speed * Math.cos(ang);
    state = "play";
  } else if (state === "clear" || state === "over") {
    resetGame();
    state = "ready";
  }
}

// ---------- 9. 効果音（WebAudioで作る簡単なピコ音。失敗しても無視） ----------
let audioCtx = null;
function initAudio() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
  } catch (e) { audioCtx = null; }
}
function beep(freq, dur = 0.06, type = "square", vol = 0.04) {
  if (!audioCtx) return;
  try {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch (e) { /* 音が出なくてもゲームは続ける */ }
}

// ---------- 10. ゲームの更新（1/60秒ごとに呼ばれる） ----------
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function update() {
  // キーでパドル移動
  if (keys.left) px -= 7;
  if (keys.right) px += 7;
  clampPaddle();

  // キラキラの更新
  for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life--; }
  particles = particles.filter((p) => p.life > 0);

  // クリア後は暗幕がだんだん消えて、絵が全部見える
  if (state === "clear") dim = Math.max(0, dim - 0.012);

  if (state === "ready") {            // 発射前はボールがパドルに乗ってついてくる
    ball.x = px; ball.y = PADDLE_Y - BALL_R;
  } else if (state === "play") {
    moveBall();
  }
}

// ボールを動かす。速いボールが壁やブロックをすり抜けないよう、細かく分けて動かす
function moveBall() {
  const n = Math.ceil(speed / 3);     // 1回の移動が3px以下になるように分割
  for (let i = 0; i < n; i++) {
    // --- 横に動かす ---
    ball.x += ball.vx / n;
    if (ball.x < BALL_R) { ball.x = BALL_R; ball.vx = Math.abs(ball.vx); beep(300); }
    if (ball.x > W - BALL_R) { ball.x = W - BALL_R; ball.vx = -Math.abs(ball.vx); beep(300); }
    collideBlocks("x");

    // --- 縦に動かす ---
    ball.y += ball.vy / n;
    if (ball.y < BALL_R) { ball.y = BALL_R; ball.vy = Math.abs(ball.vy); beep(300); }
    // パドルに当たった？（下向きに動いているときだけ判定）
    if (ball.vy > 0 &&
        ball.y + BALL_R >= PADDLE_Y && ball.y < PADDLE_Y + PADDLE_H &&
        Math.abs(ball.x - px) <= PADDLE_W / 2 + BALL_R) {
      // パドルの端に当たるほど、斜めに跳ね返す
      const rel = clamp((ball.x - px) / (PADDLE_W / 2), -1, 1);
      const ang = rel * Math.PI / 3;  // 最大60度
      ball.vx = speed * Math.sin(ang);
      ball.vy = -speed * Math.cos(ang);
      ball.y = PADDLE_Y - BALL_R;
      beep(520, 0.07, "triangle", 0.06);
    }
    collideBlocks("y");

    // 画面の下に落ちた → ライフを1つ減らす
    if (ball.y - BALL_R > H) { loseLife(); return; }
    if (state !== "play") return;     // クリアしたら中断
  }
}

// ボールがブロックに当たったか調べる。axis は今動かした向き("x"か"y")
function collideBlocks(axis) {
  if (ball.y - BALL_R > FIELD_H) return;   // ブロックの範囲外なら調べない
  // ボールの周りにあるブロックだけを調べる（全部調べると重いので）
  const c0 = clamp(Math.floor((ball.x - BALL_R) / BW), 0, COLS - 1);
  const c1 = clamp(Math.floor((ball.x + BALL_R) / BW), 0, COLS - 1);
  const r0 = clamp(Math.floor((ball.y - BALL_R) / BH), 0, ROWS - 1);
  const r1 = clamp(Math.floor((ball.y + BALL_R) / BH), 0, ROWS - 1);
  for (let r = r0; r <= r1; r++) {
    for (let c = c0; c <= c1; c++) {
      const b = grid[r][c];
      if (!b.alive) continue;
      // 円と四角の当たり判定：四角の中でボールに一番近い点との距離を測る
      const nx = clamp(ball.x, b.x, b.x + BW);
      const ny = clamp(ball.y, b.y, b.y + BH);
      const dx = ball.x - nx, dy = ball.y - ny;
      if (dx * dx + dy * dy >= BALL_R * BALL_R) continue;

      // 当たった！ 動かした向きに応じて跳ね返し、ブロックの外に押し出す
      if (axis === "x") {
        ball.x = ball.vx > 0 ? b.x - BALL_R - 0.01 : b.x + BW + BALL_R + 0.01;
        ball.vx = -ball.vx;
      } else {
        ball.y = ball.vy > 0 ? b.y - BALL_R - 0.01 : b.y + BH + BALL_R + 0.01;
        ball.vy = -ball.vy;
      }
      hitBlock(b);
      return;   // 1回の移動で壊すのは1個まで
    }
  }
}

// ブロックにダメージを与える
function hitBlock(b) {
  b.hp--;
  if (b.hp <= 0) {
    b.alive = false;
    remaining--;
    score += b.maxhp === 2 ? 20 : 10;
    sparkle(b, 9);
    beep(b.maxhp === 2 ? 760 : 640, 0.07);
  } else {
    sparkle(b, 3);          // 硬いブロックは1回目だと割れ目が入るだけ
    beep(420, 0.05);
  }
  // 壊すたびに少しずつ速くなる（上限あり）
  speed = Math.min(SPEED_MAX, speed + 0.05);
  normalizeVelocity();

  if (remaining === 0) {    // 全部壊した！ → クリア
    state = "clear";
    score += lives * 100;   // 残りライフのボーナス
    beep(880, 0.15, "triangle", 0.07);
  }
}

// ボールの速さを speed にそろえる。横ばかりに飛び続けないよう、縦成分の最低値も守る
function normalizeVelocity() {
  const minVy = speed * 0.25;
  if (Math.abs(ball.vy) < minVy) ball.vy = (ball.vy < 0 ? -1 : 1) * minVy;
  const m = Math.hypot(ball.vx, ball.vy) || 1;
  ball.vx = ball.vx / m * speed;
  ball.vy = ball.vy / m * speed;
}

// ブロックの色のかけらを飛ばす
function sparkle(b, count) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x: b.x + Math.random() * BW, y: b.y + Math.random() * BH,
      vx: (Math.random() - 0.5) * 3, vy: -Math.random() * 2.5,
      life: 30 + Math.random() * 20, color: b.color
    });
  }
}

// ミス処理
function loseLife() {
  lives--;
  beep(150, 0.3, "sawtooth", 0.06);
  if (lives <= 0) {
    state = "over";
  } else {
    state = "ready";
    serve();
  }
}

// ---------- 11. 描画 ----------
const FONT = '"Hiragino Sans","Yu Gothic","Meiryo",sans-serif';

// 文字を影つきで描く道具
function text(str, x, y, size, color = "#fff", align = "center", weight = "bold") {
  ctx.font = `${weight} ${size}px ${FONT}`;
  ctx.textAlign = align;
  ctx.textBaseline = "middle";
  ctx.shadowColor = "rgba(0,0,0,0.8)";
  ctx.shadowBlur = 6;
  ctx.fillStyle = color;
  ctx.fillText(str, x, y);
  ctx.shadowBlur = 0;
}

// ベール1枚（ブロック1個）を描く
function drawBlock(b) {
  // ぼかした絵をベースに、暗い色を重ねて「布のベール」っぽくする
  ctx.drawImage(veil, b.x, b.y, BW, BH, b.x, b.y, BW, BH);
  const hard = b.maxhp === 2;
  ctx.fillStyle = hard && b.hp === 2 ? "rgba(45,30,75,0.60)" : "rgba(20,26,60,0.42)";
  ctx.fillRect(b.x, b.y, BW, BH);
  ctx.fillStyle = "rgba(255,255,255,0.16)";           // 上のふちのツヤ
  ctx.fillRect(b.x + 1, b.y + 1, BW - 2, 2);
  // ふち：硬いブロックは金色
  ctx.lineWidth = hard && b.hp === 2 ? 2 : 1;
  ctx.strokeStyle = hard ? (b.hp === 2 ? "rgba(255,214,120,0.95)" : "rgba(255,214,120,0.45)")
                         : "rgba(255,255,255,0.22)";
  ctx.strokeRect(b.x + 1, b.y + 1, BW - 2, BH - 2);
  // 割れ目（硬いブロックを1回あてたあと）
  if (hard && b.hp === 1) {
    ctx.strokeStyle = "rgba(255,255,255,0.7)";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(b.x + 10, b.y + 3);
    ctx.lineTo(b.x + 22, b.y + 16);
    ctx.lineTo(b.x + 16, b.y + 22);
    ctx.lineTo(b.x + 30, b.y + BH - 3);
    ctx.stroke();
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  if (state === "loading") {
    ctx.fillStyle = "#0d0e1a"; ctx.fillRect(0, 0, W, H);
    text("よみこみ中…", W / 2, H / 2, 22);
    return;
  }

  // 一番下の層：本物の絵（ブロックが壊れた場所から見える）
  ctx.drawImage(painting, 0, 0, W, H);

  // 下の操作エリアは暗幕をかけて、文字を読みやすくする
  if (dim > 0) {
    ctx.fillStyle = `rgba(10,12,28,${0.8 * dim})`;
    ctx.fillRect(0, FIELD_H, W, H - FIELD_H);
  }

  // ベール（生きているブロックだけ描く → 壊れた場所は絵が見える）
  for (const b of blocks) if (b.alive) drawBlock(b);

  // キラキラ
  for (const p of particles) {
    ctx.fillStyle = `rgba(${p.color},${Math.min(1, p.life / 25)})`;
    ctx.fillRect(p.x, p.y, 4, 4);
  }

  if (state !== "clear" || dim > 0.3) drawHud();

  // パドルとボール（クリア後は消す）
  if (state !== "clear") {
    const g = ctx.createLinearGradient(0, PADDLE_Y, 0, PADDLE_Y + PADDLE_H);
    g.addColorStop(0, "#ffe9a8"); g.addColorStop(1, "#d9a441");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.roundRect(px - PADDLE_W / 2, PADDLE_Y, PADDLE_W, PADDLE_H, 6);
    ctx.fill();

    if (state !== "over") {
      ctx.shadowColor = "rgba(255,255,255,0.9)"; ctx.shadowBlur = 12;
      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
    }
  }

  drawOverlay();
}

// 画面下の表示（スコア・ライフ・絵がひらいた割合）
function drawHud() {
  const pct = Math.round((totalBlocks - remaining) / totalBlocks * 100);
  const y = FIELD_H + 26;
  text("スコア " + score, 16, y, 17, "#fff", "left");
  // ライフは丸で表示
  for (let i = 0; i < LIVES_START; i++) {
    ctx.fillStyle = i < lives ? "#ffe9a8" : "rgba(255,255,255,0.2)";
    ctx.beginPath(); ctx.arc(W - 22 - i * 22, y, 7, 0, Math.PI * 2); ctx.fill();
  }
  // 「絵がひらいた」進み具合のバー
  ctx.fillStyle = "rgba(255,255,255,0.15)";
  ctx.fillRect(16, y + 22, W - 32, 8);
  const gr = ctx.createLinearGradient(16, 0, W - 16, 0);
  gr.addColorStop(0, "#7fb4ff"); gr.addColorStop(1, "#ffe9a8");
  ctx.fillStyle = gr;
  ctx.fillRect(16, y + 22, (W - 32) * pct / 100, 8);
  text("絵がひらいた " + pct + "%", W / 2, y + 46, 14, "#dfe6ff");
}

// タイトル・ゲームオーバー・クリアの表示
function drawOverlay() {
  if (state === "title") {
    ctx.fillStyle = "rgba(8,10,28,0.62)"; ctx.fillRect(0, 0, W, H);
    text("ベールくずし", W / 2, 190, 52, "#ffe9a8");
    text("ベールをくずして、", W / 2, 270, 20);
    text("かくれた一枚の絵をあらわそう", W / 2, 300, 20);
    text("マウス／←→キー／指でパドルを動かす", W / 2, 370, 16, "#cfd8ff", "center", "normal");
    text("金のふちは2回あてると割れる", W / 2, 398, 16, "#ffd678", "center", "normal");
    text("クリック・タップ・スペースではじめる", W / 2, 480, 20, "#fff");
  } else if (state === "ready") {
    text("クリック・タップ・スペースで発射", W / 2, PADDLE_Y - 60, 16, "#fff");
  } else if (state === "over") {
    ctx.fillStyle = "rgba(8,10,28,0.6)"; ctx.fillRect(0, 0, W, H);
    const pct = Math.round((totalBlocks - remaining) / totalBlocks * 100);
    text("ゲームオーバー", W / 2, 240, 40, "#ff9aa8");
    text("絵は " + pct + "% ひらきました", W / 2, 300, 22);
    text("スコア " + score, W / 2, 340, 20);
    text("クリック・タップ・スペースでもう一度", W / 2, 420, 18);
  } else if (state === "clear" && dim < 0.5) {
    ctx.fillStyle = "rgba(8,10,28,0.55)";
    ctx.beginPath(); ctx.roundRect(60, H - 190, W - 120, 120, 14); ctx.fill();
    text("クリア！", W / 2, H - 160, 32, "#ffe9a8");
    text("絵がぜんぶ ひらきました", W / 2, H - 122, 18);
    text("スコア " + score + "　／　クリックでもう一度", W / 2, H - 92, 14, "#cfd8ff", "center", "normal");
  }
}

// ---------- 12. メインループ ----------
// 画面のリフレッシュレートが違っても同じ速さで動くよう、1/60秒ずつ更新する
let last = performance.now(), acc = 0;
const STEP = 1000 / 60;
function frame(now) {
  acc += Math.min(now - last, 100);
  last = now;
  while (acc >= STEP) { if (state !== "loading") update(); acc -= STEP; }
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
